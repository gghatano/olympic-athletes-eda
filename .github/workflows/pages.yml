name: Build and deploy site

# 図・レポート・サイトを CI で作り直してから Pages に出す。
# 成果物（figures/ と reports/eda-report.md）はリポジトリにもコミットされているが、
# ここで再生成することで「スクリプトを直したのに図が古い」状態を防ぎ、
# 同時に R スクリプトが壊れていないかの検査も兼ねる。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイの取りこぼしを避けるため、進行中のものはキャンセルしない
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ランナーには日本語フォントが入っていない。
      # 入れずに描画すると図のラベルが全て豆腐文字になる
      # （R/theme_olympic.R はフォントが無ければ失敗するようにしてある）。
      - name: システム依存と日本語フォントを入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk \
            libfontconfig1-dev libfreetype6-dev \
            libpng-dev libtiff-dev libjpeg-dev \
            libharfbuzz-dev libfribidi-dev
          fc-cache -f

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # Posit Public Package Manager を使う。
          # Linux 向けのビルド済みバイナリが降ってくるので、
          # ggplot2 等をソースからビルドせずに済む。
          use-public-rspm: true

      - name: R パッケージをキャッシュする
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('R/setup.R') }}
          restore-keys: ${{ runner.os }}-r-

      - name: 依存パッケージを入れる
        run: Rscript -e 'source("R/setup.R"); ensure_packages()'

      - name: 図を生成する
        run: Rscript run_all.R

      - name: レポートを生成する
        run: Rscript reports/render.R

      # README と docs の本文に直接書いた数値を実データと突き合わせる。
      # 図とレポートは毎回再生成されるので勝手に追従するが、本文はしない。
      # olympicAthletes は更新中のパッケージなので、上流がデータを足すと
      # 本文だけが静かに古くなる。ここで落として気づけるようにしている。
      - name: 本文の数値を検証する
        run: Rscript tests/check_claims.R

      - name: サイトを生成する
        run: Rscript site/build_site.R

      # 空のサイトや図の抜けたサイトをデプロイしてしまう事故を防ぐ。
      - name: 生成物を検査する
        run: |
          set -eu
          for f in _site/index.html _site/reports/eda-report.html \
                   _site/docs/data-dictionary.html _site/docs/preprocessing.html \
                   _site/docs/analysis-ideas.html _site/assets/style.css; do
            test -s "$f" || { echo "欠落または空: $f"; exit 1; }
          done
          # 枚数は決め打ちにせず figures/ と一致するかを見る
          src=$(find figures -name '*.png' | wc -l)
          out=$(find _site/figures -name '*.png' | wc -l)
          echo "figures: $src -> _site: $out"
          test "$src" -gt 0
          test "$src" -eq "$out"
          # 生成 HTML に未解決の Markdown リンクが残っていないこと
          if grep -rq 'href="[^"]*\.md[^"]*"' _site/; then
            echo "サイト内に .md へのリンクが残っています:"
            grep -ro 'href="[^"]*\.md[^"]*"' _site/ | sort -u
            exit 1
          fi
          # 本文が参照している図が実在すること。
          # 図のファイル名を変えたときに参照の直し漏れを拾う。
          missing=0
          for f in $(grep -roh 'src="[^"]*\.png"' _site/ \
                     | sed 's/src="//;s/"//' | sed 's|.*/||' | sort -u); do
            if [ ! -f "figures/$f" ]; then
              echo "参照されているが存在しない図: $f"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Pages への公開は master への push のときだけ行う。
  # pull_request ではビルドの成否確認までに留める。
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
